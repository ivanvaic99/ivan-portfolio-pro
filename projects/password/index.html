<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Password Generator</title>
<style>
  :root { --bg:#0b0f19; --card:#121826; --muted:#a1a1aa; --text:#fafafa; --accent:#f472b6; }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
  .wrap{max-width:720px;margin:40px auto;padding:24px}
  .card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:20px}
  input[type="range"]{width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .muted{color:var(--muted)}
  .back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none}
  button{border:0;background:var(--accent);color:#0b0f19;font-weight:600;border-radius:999px;padding:10px 16px;cursor:pointer}
  input[type="checkbox"]{transform:scale(1.1)}
  .out{word-break:break-all;background:#0d1220;border:1px solid #334155;border-radius:12px;padding:12px}
</style>
<body>
  <div class="wrap">
    <a class="back" href="../../">← Back to portfolio</a>
    <h1>Password Generator</h1>

    <div class="card">
      <label>Length: <span id="lenV">16</span></label>
      <input id="len" type="range" min="6" max="64" value="16" />

      <div class="row" style="margin:12px 0">
        <label><input id="u" type="checkbox" checked> Uppercase</label>
        <label><input id="l" type="checkbox" checked> Lowercase</label>
        <label><input id="d" type="checkbox" checked> Digits</label>
        <label><input id="s" type="checkbox" checked> Symbols</label>
      </div>

      <div class="row">
        <button id="gen">Generate</button>
        <button id="copy" style="background:#22d3ee">Copy</button>
      </div>

      <div class="out" id="out" style="margin-top:12px">—</div>
      <div class="muted">Tip: keep it 12–20 chars; store in a password manager.</div>
    </div>
  </div>
<script>
const len=document.getElementById('len'), lenV=document.getElementById('lenV')
const out=document.getElementById('out')
const sets={ u:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', l:'abcdefghijklmnopqrstuvwxyz', d:'0123456789', s:'!@#$%^&*()-_=+[]{};:,.?/|' }
len.oninput=()=> lenV.textContent=len.value
function generate(){
  const active=['u','l','d','s'].filter(k=>document.getElementById(k).checked)
  if(active.length===0) { alert('Select at least one set'); return }
  const L=+len.value
  let pool='', pwd=[]
  active.forEach(k=>pool+=sets[k])
  // ensure one from each active set
  active.forEach(k=> pwd.push( sets[k][Math.floor(Math.random()*sets[k].length)] ))
  for(let i=pwd.length;i<L;i++) pwd.push( pool[Math.floor(Math.random()*pool.length)] )
  // shuffle
  for(let i=pwd.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pwd[i],pwd[j]]=[pwd[j],pwd[i]] }
  out.textContent=pwd.join('')
}
document.getElementById('gen').onclick=generate
document.getElementById('copy').onclick=()=>{ navigator.clipboard.writeText(out.textContent); alert('Copied!') }
generate()
</script>
</body>
</html>
