<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gradient Generator</title>
<style>
  :root { --bg:#0b0f19; --card:#121826; --muted:#a1a1aa; --text:#fafafa; --accent:#34d399; }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
  .wrap{max-width:900px;margin:40px auto;padding:24px}
  .card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:20px}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  input[type="range"], input[type="text"]{width:100%}
  .box{height:220px;border-radius:12px;border:1px solid #334155;margin-top:12px}
  button{border:0;background:var(--accent);color:#0b0f19;font-weight:600;border-radius:999px;padding:10px 16px;cursor:pointer}
  .out{background:#0d1220;border:1px solid #334155;border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none}
</style>
<body>
  <div class="wrap">
    <a class="back" href="../../">← Back to portfolio</a>
    <h1>Gradient Generator</h1>

    <div class="card">
      <div class="row">
        <label>Color 1<br><input id="c1" type="color" value="#1e3a8a"></label>
        <label>Color 2<br><input id="c2" type="color" value="#22d3ee"></label>
        <label>Angle (<span id="angV">45</span>°)<br><input id="ang" type="range" min="0" max="360" value="45"></label>
      </div>

      <div class="box" id="box"></div>

      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="css" class="out" readonly>
        <button id="copy">Copy CSS</button>
      </div>
    </div>
  </div>
<script>
const c1=document.getElementById('c1'), c2=document.getElementById('c2'), ang=document.getElementById('ang'), angV=document.getElementById('angV')
const box=document.getElementById('box'), css=document.getElementById('css')
function render(){
  const g=`linear-gradient(${ang.value}deg, ${c1.value}, ${c2.value})`
  box.style.background=g; css.value=`background: ${g};`
  angV.textContent=ang.value
}
[c1,c2,ang].forEach(el=>el.oninput=render); render()
document.getElementById('copy').onclick=()=>{ navigator.clipboard.writeText(css.value); alert('Copied!') }
</script>
</body>
</html>
