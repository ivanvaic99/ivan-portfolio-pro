<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Notes App</title>
<style>
  :root { --bg:#0b0f19; --card:#121826; --muted:#a1a1aa; --text:#fafafa; --accent:#a78bfa; }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
  .wrap{max-width:880px;margin:40px auto;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:12px;display:flex;flex-direction:column}
  textarea{resize:vertical;min-height:120px;width:100%;border:1px solid #334155;background:#0d1220;color:var(--text);border-radius:12px;padding:10px}
  button{border:0;background:var(--accent);color:#0b0f19;font-weight:600;border-radius:999px;padding:8px 14px;cursor:pointer}
  .row{display:flex;gap:8px;align-items:center}
  .muted{color:var(--muted)}
  .back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none}
</style>
<body>
  <div class="wrap">
    <a class="back" href="../../">← Back to portfolio</a>
    <h1>Notes</h1>
    <div class="row" style="margin:10px 0">
      <textarea id="new" placeholder="Write a note..."></textarea>
    </div>
    <div class="row" style="margin-bottom:16px">
      <button id="add">Add Note</button>
      <span class="muted">Notes are saved in your browser (localStorage).</span>
    </div>
    <div id="list" class="grid"></div>
  </div>
<script>
const listEl=document.getElementById('list'), newEl=document.getElementById('new')
document.getElementById('add').onclick=()=>{ const t=newEl.value.trim(); if(!t) return; add({id:crypto.randomUUID(),text:t}); newEl.value=''; save() }
let notes=[]
function add(n){ notes.unshift(n); render() }
function del(id){ notes=notes.filter(n=>n.id!==id); render(); save() }
function edit(id){ const n=notes.find(n=>n.id===id); const t=prompt('Edit note:', n.text); if(t!=null){ n.text=t; render(); save() } }
function render(){
  listEl.innerHTML = notes.map(n=>`
    <div class="card">
      <div class="muted" style="font-size:12px">${new Date().toLocaleString()}</div>
      <div style="margin:8px 0; white-space:pre-wrap">${n.text.replace(/[<>&]/g, s=>({ '<':'&lt;','>':'&gt;','&':'&amp;' }[s]))}</div>
      <div class="row" style="margin-top:auto">
        <button onclick="edit('${n.id}')">Edit</button>
        <button onclick="del('${n.id}')" style="background:#ef4444;color:white">Delete</button>
      </div>
    </div>`).join('')
}
function save(){ localStorage.setItem('notes-app', JSON.stringify(notes)) }
try{ notes=JSON.parse(localStorage.getItem('notes-app'))||[] }catch{ notes=[] }
render()
</script>
</body>
</html>
